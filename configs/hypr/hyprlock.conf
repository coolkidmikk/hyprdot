# ==============================================================================
#  HYPRLOCK
# ==============================================================================

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# ------------------------------------------------------------------------------
#  BACKGROUND
# ------------------------------------------------------------------------------
background {
    monitor =
    path = screenshot
    
    # Smooth, low-grain blur
    blur_passes = 2
    blur_size = 4
    
    # Darken background
    brightness = 0.4
    contrast = 1.0
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# ------------------------------------------------------------------------------
#  TIME
# ------------------------------------------------------------------------------
label {
    monitor =
   #text = $TIME
    text = cmd[update:1000] echo "$(date +"%I:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 80
    font_family = JetBrains Mono Bold
    
    position = 0, 150
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
#  DATE
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(200, 200, 200, 1.0)
    font_size = 20
    font_family = JetBrains Mono Bold
    
    position = 0, 80
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
#  USER ICON
# ------------------------------------------------------------------------------
label {
    monitor =
#    text = ‎  ‎ 
    text =   $USER    
    color = rgba(204, 204, 204, 1.0)
    font_size = 45
    font_family = JetBrainsMono Nerd Font
    
    position = 0, -30
    halign = center
    valign = center
    
    # Subtle shadow prevents rendering glitches at edges
    shadow_passes = 1
    shadow_size = 2
}

# ------------------------------------------------------------------------------
#  INPUT FIELD
# ------------------------------------------------------------------------------
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 1
    
    dots_size = 0.25 
    dots_spacing = 0.2 
    dots_center = true
    dots_rounding = -1
    
    # White-Gray Border (#cccccc)
    outer_color = rgb(204, 204, 204)
    
    # Dark Background
    inner_color = rgba(16, 16, 16, 0.9)
    
    # Text
    font_color = rgb(255, 255, 255)
    font_family = JetBrains Mono Regular
    
    # Feedback Colors
    check_color = rgb(235, 203, 139) # Yellow
    fail_color = rgb(191, 97, 106)   # Red
    
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    
    hide_input = false
    
    position = 0, -100
    halign = center
    valign = center
    
    rounding = 0
}

# ------------------------------------------------------------------------------
#  UPTIME
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:5000] echo "uptime ~ $(uptime -p | sed 's/^up //')"
    color = rgba(180, 180, 180, 0.8)
    font_size = 14
    font_family = JetBrains Mono Regular

    position = 0, -150
    halign = center
    valign = center
}

