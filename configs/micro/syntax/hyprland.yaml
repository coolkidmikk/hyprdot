filetype: hyprland

detect:
    filename: "(hyprland|hyprpaper|hypridle|hyprlock)\\.conf$"

rules:
    - comment: "#.*$"

    - constant.string: "\".*?\""

    - identifier: "\\$[a-zA-Z0-9_]+"

    - constant.number: "\\b[0-9]+(\\.?[0-9]+)?\\b"
    - special: "(0x|#)[0-9a-fA-F]{6,8}"
    - special: "rgba\\([^)]+\\)"
    - special: "rgb\\([^)]+\\)"
    - constant.bool: "\\b(true|false|yes|no|on|off)\\b"

    - symbol: "[\\{\\}=,]"

    - statement: "^\\s*(exec|exec-once|bind|bindm|bindl|binde|monitor|source|env|layerrule|windowrule|windowrulev2|bezier|animation|submap)"

    - statement: "^\\s*[a-z0-9_-]+"
