## name: Monolith
## author: Mikk
## description: UI is strict Black/Silver, but Text Colors are preserved for syntax highlighting.

# ------------------------------------------------------------------------------
# BASE UI
# ------------------------------------------------------------------------------
background              #101010
foreground              #FFFFFF
selection_background    #cccccc
selection_foreground    #101010

# ------------------------------------------------------------------------------
# CURSOR & URL
# ------------------------------------------------------------------------------
cursor                  #cccccc
cursor_text_color       #101010
url_color               #cccccc

# ------------------------------------------------------------------------------
# BORDERS
# ------------------------------------------------------------------------------
active_border_color     #cccccc
inactive_border_color   #333333
bell_border_color       #ff5555

# ------------------------------------------------------------------------------
# TABS
# ------------------------------------------------------------------------------
active_tab_foreground   #101010
active_tab_background   #cccccc
inactive_tab_foreground #666666
inactive_tab_background #101010
tab_bar_background      #101010

# ------------------------------------------------------------------------------
# COLOR PALETTE (Customized Logic)
# ------------------------------------------------------------------------------

# Black
color0                  #282828
color8                  #505050

# Red (Errors / Invalid Command) -> Soft Red
color1                  #ff5555
color9                  #ff6e67

# Green (Valid Command) -> MAPPED TO BLUE
# valid commands will be blue. ZSH uses "Green" for this.
# So we make the "Green" slot Blue.
color2                  #1793D1
color10                 #1793D1

# Yellow (Warnings) -> Soft Gold
color3                  #e6c07b
color11                 #e6c07b

# Blue (Directories) -> MAPPED TO RED/#C30010
color4                  #C30010
color12                 #ffffff

# Magenta (Variables) -> Kept Pink/Purple for contrast
color5                  #c678dd
color13                 #c678dd

# Cyan (Symlinks) -> Mapped to Teal
color6                  #56b6c2
color14                 #56b6c2

# White (Text)
color7                  #e6e6e6
color15                 #ffffff
